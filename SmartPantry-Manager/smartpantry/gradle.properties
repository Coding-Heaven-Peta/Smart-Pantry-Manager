# Project-wide Gradle settings.
# 1 GB is plenty for this project and also builds on low-memory laptops.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# AndroidX is required by AppCompat, Material Components and RecyclerView.
android.useAndroidX=true
android.nonTransitiveRClass=true
